# IVORA: one command starts everything:  docker compose up --build
# Needs backend/.env (copy backend/.env.example).
# Dashboard: http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: iv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iv_local_only}
      POSTGRES_DB: iv_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iv -d iv_monitor"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://iv:${POSTGRES_PASSWORD:-iv_local_only}@db:5432/iv_monitor
      MODEL_DIR: /data/models
    volumes:
      - models:/data/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  models:
